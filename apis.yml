aid: red-ridgebio
name: Red RidgeBio
description: 'RedRidge Bio is a clinical-stage biotechnology company that identifies and
  develops biparatopic antibodies, an antibody class engineered to bind two distinct sites
  (epitopes) on a single target protein for greater potency and selectivity. Its programs
  span oncology (antibody-drug conjugates for solid tumors) and autoimmunity (immune-cell
  modulators), pursued through partnerships and internal discovery. The company operates
  from Basel, Switzerland with additional presence in Cambridge, Massachusetts and San
  Francisco. RedRidge Bio was surfaced as a portfolio company of IDG Capital and added to
  the API Evangelist network. It is a therapeutics developer and publishes no public
  developer API, SDK, or technical documentation surface at this time; this profile
  captures its identity and public web presence.'
